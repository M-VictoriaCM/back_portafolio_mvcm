name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta a las 00:00 y 12:00 UTC todos los días (2 veces al día)
    # Esto asegura actividad constante sin abusar de los recursos
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Supabase Client
        run: npm install @supabase/supabase-js

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_KEY);
          async function ping() {
            // Hacemos una consulta muy ligera. Cambia 'users' por cualquier tabla que tengas.
            // Incluso si da error de permisos (RLS), la conexión cuenta como actividad.
            const { data, error } = await supabase.from('users').select('id').limit(1);
            if (error) console.log('Ping realizado (con error de consulta, pero conexión exitosa):', error.message);
            else console.log('Ping exitoso, base de datos activa.');
          }
          ping();
          "